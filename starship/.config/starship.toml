"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:5)\
$os\
$username\
[](bg:1 fg:5)\
$directory\
[](fg:1 bg:3)\
$git_branch\
$git_status\
[](fg:3 bg:6)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:6 bg:2)\
$docker_context\
[](fg:2 bg:4)\
$time\
[ ](fg:4)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:7 bg:5"
style_root = "fg:7 bg:5"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:7 bg:5"
disabled = true # Disabled by default

[directory]
style = "fg:7 bg:1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:0 bg:2"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:0 bg:3"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:0 bg:3"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:0 bg:6"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:7 bg:4"
format = '[ ♥ $time ]($style)'
