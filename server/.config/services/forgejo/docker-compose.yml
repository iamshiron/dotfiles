name: forgejo

services:
  server:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - forgejo
      - proxy_network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - forgejo_data:/data
    ports:
      - "3000:3000"
      - "3001:22"

  runner:
    image: data.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    restart: always
    depends_on:
      - server
    user: "0:0"
    networks:
      - forgejo
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - forgejo_runner_data:/data
      - ./runner-config.yml:/config.yml:ro
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock

    extra_hosts:
      - "git.shiron.pink:192.168.1.19"

    command:
      - forgejo-runner
      - daemon
      - --config
      - /config.yml

networks:
  forgejo:
    external: false

  proxy_network:
    external: true

volumes:
  forgejo_data:
  forgejo_runner_data:
